services:
  - type: web
    name: icici-lombard-renewal-portal
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: customersupport@icicilombard-renewal.com
      - key: SMTP_PASS
        value: Boomshiva@123
